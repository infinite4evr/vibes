<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="tile" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#38B6FF"/>
      <stop offset="0.55" stop-color="#3D7BF5"/>
      <stop offset="1" stop-color="#5A4FE0"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".28"/>
      <stop offset=".5" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="front" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e9f0ff"/>
    </linearGradient>
    <linearGradient id="wing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3FA9FF"/>
      <stop offset="1" stop-color="#3A6FF0"/>
    </linearGradient>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="125%"><feGaussianBlur stdDeviation="8"/></filter>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#1d2a8a" flood-opacity=".28"/>
    </filter>
  </defs>
  <!-- tile (a small margin and a soft shadow, like other desktop app icons) -->
  <rect x="24" y="30" width="464" height="464" rx="106" fill="#1d2a8a" fill-opacity=".22" filter="url(#soft)"/>
  <rect x="24" y="20" width="464" height="464" rx="106" fill="url(#tile)"/>
  <rect x="24" y="20" width="464" height="464" rx="106" fill="url(#shine)"/>
  <!-- folder: back sheet with its tab, then the front -->
  <g transform="translate(0 -4)"><g filter="url(#lift)">
    <path d="M104 178a36 36 0 0 1 36-36h66a36 36 0 0 1 25.5 10.5L253 174h119a36 36 0 0 1 36 36v134a44 44 0 0 1-44 44H148a44 44 0 0 1-44-44z" fill="#fff" fill-opacity=".5"/>
    <path d="M104 238a34 34 0 0 1 34-34h236a34 34 0 0 1 34 34v106a44 44 0 0 1-44 44H148a44 44 0 0 1-44-44z" fill="url(#front)"/>
  </g>
  <!-- paper plane -->
  <path d="M186 300 336 242 256 318z" fill="url(#wing)"/>
  <path d="M256 318 336 242 306 360z" fill="#2553D6"/>
  <path d="M256 318 306 360 262 342 250 364z" fill="#1B3FAE"/>
  </g>
</svg>
