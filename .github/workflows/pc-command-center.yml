name: PC Command Center

on:
  # Called by ci.yml: on main (and when run by hand) with full: true, everything; on other branches
  # only when this app changed, with the quicker set (see ci.yml).
  workflow_call:
    inputs:
      full:
        type: boolean
        default: true
  # Or run just this app by hand (Actions → this workflow → Run workflow): everything.
  workflow_dispatch:
    inputs:
      full:
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Every supported Python on main; on other branches the oldest and the newest.
        python-version: ${{ fromJSON(inputs.full && '["3.10", "3.11", "3.12", "3.13"]' || '["3.10", "3.13"]') }}
    defaults:
      run:
        working-directory: pc-command-center
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pc-command-center/pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: python -m compileall -q src tests
      - run: python -m pytest -q
      - name: Shell syntax
        working-directory: .
        run: bash -n ubuntu-setup/setup.sh ubuntu-setup/lib/*.sh pc-command-center/data/pc-admin

  gtk-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install Ubuntu GTK/libadwaita runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-gi python3-psutil gir1.2-gtk-4.0 gir1.2-adw-1 xvfb
      - name: Open dashboard and render one frame
        working-directory: pc-command-center
        env:
          PYTHONPATH: src
          PC_NO_WELCOME: '1'
          PC_DEBUG: '1'
        run: |
          mkdir -p /tmp/pc-shots
          timeout 30s xvfb-run -a /usr/bin/python3 -m pcctl.gui.main --screenshots /tmp/pc-shots --pages dashboard --wait 0.8
          test -s /tmp/pc-shots/dashboard.png
