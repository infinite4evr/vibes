name: LumaClean APK

on:
  # Called by ci.yml: on main (and when run by hand) with full: true, everything; on other branches
  # only when this app changed, with the quicker set (see ci.yml).
  workflow_call:
    inputs:
      full:
        type: boolean
        default: true
  # Or run just this app by hand (Actions → this workflow → Run workflow): everything.
  workflow_dispatch:
    inputs:
      full:
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      apk: ${{ steps.apk.outputs.name }}
      tag: ${{ steps.apk.outputs.tag }}
      sha: ${{ steps.apk.outputs.sha }}
    defaults:
      run:
        working-directory: lumaclean
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # the action's default package list includes "tools", which no longer exists.
      # The compile SDK is left to AGP, which downloads it once licenses are accepted.
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      # Optional: a stable signing key, so each release installs over the last one.
      # Without it the runner makes a fresh debug key and the phone must uninstall first.
      - name: Restore debug keystore
        env:
          KEYSTORE_B64: ${{ secrets.LUMACLEAN_DEBUG_KEYSTORE_BASE64 }}
        if: env.KEYSTORE_B64 != ''
        run: |
          mkdir -p ~/.android
          echo "$KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore

      # release build: R8-shrunk and optimised, signed with the (restored) debug key
      - name: Build release APK
        run: gradle --no-daemon :app:assembleRelease -PversionCode=${{ github.run_number }}

      - name: Name the APK
        id: apk
        run: |
          version=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)
          sha=$(git rev-parse --short HEAD)
          name="LumaClean-${version}-${{ github.run_number }}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "tag=lumaclean-v${version}-${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: lumaclean/${{ steps.apk.outputs.name }}

  # The file operations on a real (emulated) phone: nothing may be lost when a recycle or copy is
  # cancelled or storage disappears, and the cleanup preview must explain what it deletes.
  emulator:
    name: File safety tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: lumaclean
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"
      - name: Build debug and test APKs
        run: gradle --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: File safety and cleanup preview journeys
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          working-directory: lumaclean
          script: bash ../.github/scripts/lumaclean-emulator.sh
      - name: Keep test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lumaclean-emulator
          path: lumaclean/out/
          if-no-files-found: ignore

  # Only an APK whose build and file-safety tests both passed is released.
  publish:
    name: Publish GitHub release
    needs: [build, emulator]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.apk }}
          path: verified-apk
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: LumaClean ${{ needs.build.outputs.tag }}
          # builds from branches other than main are marked pre-release
          prerelease: ${{ github.ref != 'refs/heads/main' }}
          body: |
            APK built from `${{ needs.build.outputs.sha }}` on `${{ github.ref_name }}`.
            Download the `.apk` below and open it on your phone (allow installs from unknown sources).
          files: verified-apk/${{ needs.build.outputs.apk }}
