name: CI

# One entry point for every app's checks.
#
#   main (and "Run workflow" by hand): every app, every test, full Python matrices, the Android
#   emulator: the whole repository is verified on each change that lands there.
#
#   any other branch: only the apps whose files the branch changed (compared with main), with the
#   quicker set: the oldest and newest Python instead of all of them, and the Android emulator only
#   when the Android app itself changed. A newer push to the same branch cancels the older run.
#
# Each app's jobs live in its own reusable workflow (commands.yml, pc-command-center.yml, tgdrive.yml,
# tgdrive-android.yml, lumaclean-apk.yml). Pull requests come from these same branches, whose pushes
# are already checked, so they don't run everything a second time.

on:
  push:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # Branches: only the newest push matters. main: every commit is checked to the end.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  changes:
    name: What changed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      full: ${{ steps.mode.outputs.full }}
      commands: ${{ steps.mode.outputs.full == 'true' || steps.filter.outputs.commands == 'true' }}
      pc: ${{ steps.mode.outputs.full == 'true' || steps.filter.outputs.pc == 'true' }}
      tgdrive: ${{ steps.mode.outputs.full == 'true' || steps.filter.outputs.tgdrive == 'true' }}
      android: ${{ steps.mode.outputs.full == 'true' || steps.filter.outputs.android == 'true' }}
      android_app: ${{ steps.mode.outputs.full == 'true' || steps.filter.outputs.android_app == 'true' }}
      lumaclean: ${{ steps.mode.outputs.full == 'true' || steps.filter.outputs.lumaclean == 'true' }}
    steps:
      - id: mode
        run: echo "full=${{ github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' }}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.mode.outputs.full != 'true'
        with:
          fetch-depth: 0
      # Files this branch changed compared with main (all of its commits, not only the last push).
      - uses: dorny/paths-filter@v3
        id: filter
        if: steps.mode.outputs.full != 'true'
        with:
          base: main
          filters: |
            ci: &ci
              - ".github/workflows/ci.yml"
            commands:
              - *ci
              - "commands/**"
              - ".github/workflows/commands.yml"
            pc:
              - *ci
              - "pc-command-center/**"
              - "ubuntu-setup/**"
              - ".github/workflows/pc-command-center.yml"
            tgdrive:
              - *ci
              - "tgdrive/**"
              - ".github/workflows/tgdrive.yml"
            # What the phone app is built from: the Android project and the Python service it bundles
            # (not the desktop window, its web interface or the AppImage packaging).
            android:
              - *ci
              - "tgdrive/android/**"
              - "tgdrive/tgdrive/**"
              - "tgdrive/tests/**"
              - "tgdrive/run.py"
              - ".github/workflows/tgdrive-android.yml"
              - ".github/scripts/**"
            android_app:
              - "tgdrive/android/**"
              - ".github/scripts/tgdrive-android-emulator.sh"
              - ".github/scripts/tgdrive-startup-smoke.sh"
              - ".github/workflows/tgdrive-android.yml"
            lumaclean:
              - *ci
              - "lumaclean/**"
              - ".github/workflows/lumaclean-apk.yml"
              - ".github/scripts/lumaclean-emulator.sh"
      - name: Summary
        run: |
          {
            echo "### What CI runs for this push"
            if [ "${{ steps.mode.outputs.full }}" = true ]; then
              echo "Everything (main, or run by hand)."
            else
              echo "| App | Runs |"
              echo "|---|---|"
              echo "| Study tools (commands) | ${{ steps.filter.outputs.commands }} |"
              echo "| PC Command Center + ubuntu-setup | ${{ steps.filter.outputs.pc }} |"
              echo "| TG Drive (desktop) | ${{ steps.filter.outputs.tgdrive }} |"
              echo "| TG Drive Android | ${{ steps.filter.outputs.android }} (emulator: ${{ steps.filter.outputs.android_app }}) |"
              echo "| LumaClean | ${{ steps.filter.outputs.lumaclean }} |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  commands:
    name: Study tools
    needs: changes
    if: needs.changes.outputs.commands == 'true'
    uses: ./.github/workflows/commands.yml
    with:
      full: ${{ needs.changes.outputs.full == 'true' }}

  pc-command-center:
    name: PC Command Center
    needs: changes
    if: needs.changes.outputs.pc == 'true'
    uses: ./.github/workflows/pc-command-center.yml
    with:
      full: ${{ needs.changes.outputs.full == 'true' }}

  tgdrive:
    name: TG Drive
    needs: changes
    if: needs.changes.outputs.tgdrive == 'true'
    uses: ./.github/workflows/tgdrive.yml
    with:
      full: ${{ needs.changes.outputs.full == 'true' }}

  tgdrive-android:
    name: TG Drive Android
    needs: changes
    if: needs.changes.outputs.android == 'true'
    permissions:
      contents: write   # publishes the APK as a release and the emulator screenshots to a branch
    uses: ./.github/workflows/tgdrive-android.yml
    secrets: inherit
    with:
      full: ${{ needs.changes.outputs.full == 'true' }}
      emulator: ${{ needs.changes.outputs.android_app == 'true' }}

  lumaclean:
    name: LumaClean
    needs: changes
    if: needs.changes.outputs.lumaclean == 'true'
    permissions:
      contents: write   # publishes the APK as a release
    uses: ./.github/workflows/lumaclean-apk.yml
    secrets: inherit
    with:
      full: ${{ needs.changes.outputs.full == 'true' }}
