name: TG Drive Android

on:
  push:
    paths:
      - "tgdrive/**"
      - ".github/workflows/tgdrive-android.yml"
  workflow_dispatch:

concurrency:
  group: tgdrive-android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  # The service's own tests with exactly what the Android app ships: no FastAPI/pydantic, no
  # tokenizers, safetensors, rapidfuzz, cryptg or indic-transliteration, on the app's Python.
  service-android-mode:
    name: Service tests (Android package set)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: tgdrive
    steps:
      - uses: actions/checkout@v4
      # numpy 1.26 like the app (Chaquopy's Android numpy is 1.26.2; its API differs from numpy 2),
      # so Python 3.12, the newest with 1.26 wheels on PyPI.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the Android requirements
        run: |
          python -m pip install --upgrade pip
          grep -v -E '^(numpy|pyaes)' android/app/python-requirements.txt > /tmp/android-reqs.txt
          python -m pip install -r /tmp/android-reqs.txt pyaes numpy==1.26.4 pytest httpx
          # the meaning model's files (the app bundles the same two files)
          python -m pip install --no-deps wordllama==0.4.0.post1
          python -c "import fastapi" 2>/dev/null && { echo "::error::fastapi must not be installed here"; exit 1; } || true
      - name: Tests
        run: timeout 900 python -m pytest tests -q --ignore=tests/test_e2e.py -o faulthandler_timeout=300
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"
      # The app's own data layer (Api.kt and its models, compiled for the JVM) against the running
      # service: every call the app makes. Then sign-in must reach Telegram.
      - name: The app's API calls against the service
        working-directory: tgdrive/android/contract
        run: |
          gradle --no-daemon -q installDist
          PY=python timeout 900 ./run.sh

  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: tgdrive/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"
      # Chaquopy runs pip with the same Python version as the app's (3.13)
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # Releases are signed with TG Drive's permanent key from the secrets, so every new APK installs
      # as an update (android/signing/README.md). Without them the build is debug-signed: warned below.
      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.TGDRIVE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.TGDRIVE_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::warning::No TGDRIVE_KEYSTORE_BASE64 secret: this APK is signed with a throwaway key and won't install as an update (see tgdrive/android/signing/README.md)"
            exit 0
          fi
          # A secret that can't be used: say why (without showing it), and build with a throwaway key,
          # so there is still an APK to test (it won't install over one signed with the real key).
          unusable() {
            echo "::error::Signing key: $1 This APK is signed with a throwaway key instead. See tgdrive/android/signing/README.md."
            exit 0
          }
          n=${#KEYSTORE_B64}
          case "$KEYSTORE_B64" in
            /*|~*|[A-Za-z]:\\*|*.p12|*.jks|*.keystore)
              unusable "TGDRIVE_KEYSTORE_BASE64 looks like a file path ($n characters); it must hold the file's contents, base64-encoded.";;
          esac
          [ "$n" -ge 1000 ] || unusable "TGDRIVE_KEYSTORE_BASE64 is $n characters long, far too short for a keystore (about 3 000–5 000 characters of base64). Was the password pasted there?"
          ks="$RUNNER_TEMP/tgdrive.p12"
          b64="$RUNNER_TEMP/tgdrive.b64"
          # The base64 as any tool writes it: wrapped lines (also Windows line ends), spaces, the
          # -----BEGIN/END----- lines of Windows' certutil, URL-safe letters, missing padding.
          # Also a data:…;base64, prefix, quotes or other stray characters from copying: anything outside
          # the base64 alphabet is dropped (the keystore check below catches a value that was really damaged).
          printf '%s' "$KEYSTORE_B64" | tr -d '\r' | grep -v -- '-----' | sed 's/^.*;base64,//' | tr '_-' '/+' \
            | tr -cd 'A-Za-z0-9+/' > "$b64"
          pad=$(( (4 - $(wc -c < "$b64") % 4) % 4 ))
          [ "$pad" -eq 0 ] || printf '%*s' "$pad" '' | tr ' ' '=' >> "$b64"
          if ! base64 -d "$b64" > "$ks" 2>/dev/null || [ ! -s "$ks" ]; then
            unusable "TGDRIVE_KEYSTORE_BASE64 isn't base64 text ($n characters). Encode the .p12 file and paste the whole output."
          fi
          rm -f "$b64"
          # A password pasted with a line end or spaces around it: try it without them too.
          if ! keytool -list -keystore "$ks" -storepass "$KEYSTORE_PASSWORD" > /dev/null 2>&1; then
            trimmed=$(printf '%s' "$KEYSTORE_PASSWORD" | tr -d '\r\n' | sed 's/^[[:space:]]*//; s/[[:space:]]*$//')
            if [ "$trimmed" != "$KEYSTORE_PASSWORD" ] && keytool -list -keystore "$ks" -storepass "$trimmed" > /dev/null 2>&1; then
              echo "::notice::TGDRIVE_KEYSTORE_PASSWORD has spaces or a line end around it: using it without them."
              KEYSTORE_PASSWORD=$trimmed
            fi
          fi
          if ! list=$(keytool -list -v -keystore "$ks" -storepass "$KEYSTORE_PASSWORD" 2>&1); then
            if echo "$list" | grep -qi "password"; then
              unusable "the keystore doesn't open with TGDRIVE_KEYSTORE_PASSWORD (wrong password)."
            fi
            unusable "TGDRIVE_KEYSTORE_BASE64 decodes to something that isn't a keystore ($(echo "$list" | grep -i -m1 'error\|exception' | cut -c1-120)). Encode the .p12 file made by keytool."
          fi
          alias=$(echo "$list" | sed -n 's/^Alias name: //p')
          if ! echo "$alias" | grep -qx tgdrive; then
            first=$(echo "$alias" | head -1)
            [ -n "$first" ] || unusable "the keystore has no key in it."
            echo "::notice::The keystore's key is called “$first” (not “tgdrive”): signing with it."
            echo "TGDRIVE_KEY_ALIAS=$first" >> "$GITHUB_ENV"
          fi
          echo "TGDRIVE_KEYSTORE=$ks" >> "$GITHUB_ENV"
          echo "TGDRIVE_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
      - name: Build release APK (arm64 phones and x86_64)
        run: |
          set -o pipefail
          gradle --no-daemon :app:assembleRelease -PversionCode=${{ github.run_number }} 2>&1 | tee build.log
      # An APK signed with another key can't update the installed app: never publish one by accident.
      - name: Check the signing key
        run: |
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          got=$("$apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk | sed -n 's/.*SHA-256 digest: //p' | head -1)
          echo "Signing certificate SHA-256: $got"
          want=$(tr -d ' \n' < signing/expected-certificate.sha256 2>/dev/null || true)
          if [ -n "$want" ] && [ "$got" != "$want" ]; then
            echo "::error::This APK isn't signed with TG Drive's release key ($want): it couldn't update the installed app"
            exit 1
          fi
          [ -n "$want" ] || echo "::notice::Signed with $got. Put it in tgdrive/android/signing/expected-certificate.sha256 to have CI enforce it."
      - name: Build errors
        if: failure()
        run: bash ../../.github/scripts/gradle-errors.sh build.log
      - name: Name the APK
        id: apk
        run: |
          version=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)
          name="TG_Drive-${version}-${{ github.run_number }}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$name"
          ls -la "$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "tag=tgdrive-android-v${version}-${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: tgdrive/android/${{ steps.apk.outputs.name }}
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.apk.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: TG Drive for Android ${{ steps.apk.outputs.tag }}
          prerelease: ${{ github.ref != 'refs/heads/main' }}
          body: |
            TG Drive for Android, built from `${{ steps.apk.outputs.sha }}` on `${{ github.ref_name }}`.
            Download the `.apk` below and open it on your phone (allow installs from unknown sources). Android 8.0 or newer, 64-bit.
          files: tgdrive/android/${{ steps.apk.outputs.name }}

  # The app on an emulator with the sample account: the Python service must start and answer,
  # and every screen is photographed for review.
  emulator:
    name: Emulator tests and screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 100
    defaults:
      run:
        working-directory: tgdrive/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # The emulator's data partition needs about 7 GB; a runner has about 5 GB free after the build.
      - name: Free disk space
        working-directory: .
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/share/swift /usr/local/share/boost \
            /opt/hostedtoolcache/CodeQL /usr/local/share/powershell /usr/local/lib/node_modules /opt/microsoft /opt/google/chrome
          sudo docker image prune --all --force > /dev/null 2>&1 || true
          df -h / | tail -1
      # "staging" is the release build (R8-minified) made debuggable: the emulator tests what phones get.
      - name: Build staging and test APKs (x86_64)
        run: |
          set -o pipefail
          gradle --no-daemon :app:assembleStaging :app:assembleStagingAndroidTest -Pabis=x86_64 -PtestBuildType=staging 2>&1 | tee build.log
      - name: Build errors
        if: failure()
        run: bash ../../.github/scripts/gradle-errors.sh build.log
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          ram-size: 4096M
          disk-size: 4G
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          working-directory: tgdrive/android
          script: bash ../../.github/scripts/tgdrive-android-emulator.sh
      # Screenshots and logs also go to the tgdrive-android-screens branch (one commit, replaced
      # each run), where they can be looked at without downloading artifacts.
      - name: Publish screenshots and logs to a branch
        if: always() && github.event_name == 'push'
        run: |
          [ -d out ] || exit 0
          pub=$(mktemp -d)
          cp -r out/. "$pub/"
          cd "$pub"
          git init -q -b tgdrive-android-screens
          git add -A
          git -c user.name="TG Drive CI" -c user.email="ci@users.noreply.github.com" commit -qm "Emulator screenshots and logs for ${GITHUB_SHA}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" HEAD:tgdrive-android-screens
      - name: Keep screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tgdrive-android-emulator
          path: |
            tgdrive/android/out/
          if-no-files-found: ignore
