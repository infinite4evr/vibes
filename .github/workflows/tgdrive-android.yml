name: TG Drive Android

on:
  push:
    paths:
      - "tgdrive/**"
      - ".github/workflows/tgdrive-android.yml"
  workflow_dispatch:

concurrency:
  group: tgdrive-android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  # The service's own tests with exactly what the Android app ships: no FastAPI/pydantic, no
  # tokenizers, safetensors, rapidfuzz, cryptg or indic-transliteration, on the app's Python.
  service-android-mode:
    name: Service tests (Android package set)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: tgdrive
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install the Android requirements
        run: |
          python -m pip install --upgrade pip
          grep -v -E '^(numpy|pyaes)' android/app/python-requirements.txt > /tmp/android-reqs.txt
          python -m pip install -r /tmp/android-reqs.txt pyaes numpy pytest httpx
          # the meaning model's files (the app bundles the same two files)
          python -m pip install --no-deps wordllama==0.4.0.post1
          python -c "import fastapi" 2>/dev/null && { echo "::error::fastapi must not be installed here"; exit 1; } || true
      - name: Tests
        run: timeout 900 python -m pytest tests -q --ignore=tests/test_e2e.py -o faulthandler_timeout=300

  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: tgdrive/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"
      # Chaquopy runs pip with the same Python version as the app's (3.13)
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.TGDRIVE_DEBUG_KEYSTORE_BASE64 || secrets.LUMACLEAN_DEBUG_KEYSTORE_BASE64 }}
        if: env.KEYSTORE_B64 != ''
        run: |
          mkdir -p ~/.android
          echo "$KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore
      - name: Build release APK (arm64 phones and x86_64)
        run: |
          set -o pipefail
          gradle --no-daemon :app:assembleRelease -PversionCode=${{ github.run_number }} 2>&1 | tee build.log
      - name: Build errors
        if: failure()
        run: bash ../../.github/scripts/gradle-errors.sh build.log
      - name: Name the APK
        id: apk
        run: |
          version=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)
          name="TG_Drive-${version}-${{ github.run_number }}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$name"
          ls -la "$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "tag=tgdrive-android-v${version}-${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: tgdrive/android/${{ steps.apk.outputs.name }}
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.apk.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: TG Drive for Android ${{ steps.apk.outputs.tag }}
          prerelease: ${{ github.ref != 'refs/heads/main' }}
          body: |
            TG Drive for Android, built from `${{ steps.apk.outputs.sha }}` on `${{ github.ref_name }}`.
            Download the `.apk` below and open it on your phone (allow installs from unknown sources). Android 8.0 or newer, 64-bit.
          files: tgdrive/android/${{ steps.apk.outputs.name }}

  # The app on an emulator with the sample account: the Python service must start and answer,
  # and every screen is photographed for review.
  emulator:
    name: Emulator tests and screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: tgdrive/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build debug and test APKs (x86_64)
        run: |
          set -o pipefail
          gradle --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest -Pabis=x86_64 2>&1 | tee build.log
      - name: Build errors
        if: failure()
        run: bash ../../.github/scripts/gradle-errors.sh build.log
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          ram-size: 4096M
          disk-size: 6G
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          working-directory: tgdrive/android
          script: bash ../../.github/scripts/tgdrive-android-emulator.sh
      - name: Keep screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tgdrive-android-emulator
          path: |
            tgdrive/android/out/
          if-no-files-found: ignore
