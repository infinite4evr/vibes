	menuentry 'Ubuntu, with Linux 7.0.0-12-generic (recovery mode)' --class ubuntu --class gnu-linux --class gnu --class os $menuentry_id_option 'gnulinux-7.0.0-12-generic-recovery-8c1f2b3a-1111-2222-3333-444455556666' {
