# Starship prompt - Catppuccin Mocha. Docs: https://starship.rs/config/
"$schema" = 'https://starship.rs/config-schema.json'
palette = "catppuccin_mocha"
add_newline = true
command_timeout = 800

format = """
$os$directory$git_branch$git_state$git_status$nodejs$python$rust$golang$java$docker_context$cmd_duration
$character"""

[os]
disabled = false
style = "bold blue"
format = "[$symbol]($style)"

[os.symbols]
Ubuntu = " "
Linux = " "

[directory]
style = "bold lavender"
format = "[$path]($style)[$read_only]($read_only_style) "
truncation_length = 3
truncation_symbol = "…/"
read_only = " 󰌾"
read_only_style = "red"

[git_branch]
symbol = " "
style = "bold mauve"
format = "[on](overlay1) [$symbol$branch]($style) "

[git_state]
style = "bold peach"

[git_status]
style = "peach"
format = "([$all_status$ahead_behind]($style) )"
conflicted = "="
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
untracked = "?${count}"
modified = "!${count}"
staged = "+${count}"
deleted = "✘${count}"
stashed = ""

[nodejs]
symbol = " "
style = "green"
format = "[via](overlay1) [$symbol($version)]($style) "

[python]
symbol = " "
style = "yellow"
format = "[via](overlay1) [$symbol($version )(\\($virtualenv\\) )]($style)"

[rust]
symbol = "󱘗 "
style = "peach"
format = "[via](overlay1) [$symbol($version)]($style) "

[golang]
symbol = " "
style = "sapphire"
format = "[via](overlay1) [$symbol($version)]($style) "

[java]
symbol = " "
style = "red"
format = "[via](overlay1) [$symbol($version)]($style) "

[docker_context]
symbol = " "
style = "blue"
format = "[via](overlay1) [$symbol$context]($style) "

[cmd_duration]
min_time = 2000
style = "yellow"
format = "[took](overlay1) [$duration]($style) "

[character]
success_symbol = "[❯](bold mauve)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold green)"

[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
flamingo = "#f2cdcd"
pink = "#f5c2e7"
mauve = "#cba6f7"
red = "#f38ba8"
maroon = "#eba0ac"
peach = "#fab387"
yellow = "#f9e2af"
green = "#a6e3a1"
teal = "#94e2d5"
sky = "#89dceb"
sapphire = "#74c7ec"
blue = "#89b4fa"
lavender = "#b4befe"
text = "#cdd6f4"
subtext1 = "#bac2de"
subtext0 = "#a6adc8"
overlay2 = "#9399b2"
overlay1 = "#7f849c"
overlay0 = "#6c7086"
surface2 = "#585b70"
surface1 = "#45475a"
surface0 = "#313244"
base = "#1e1e2e"
mantle = "#181825"
crust = "#11111b"
